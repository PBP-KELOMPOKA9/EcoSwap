{% comment %}Tombol hati wishlist. Butuh variabel: barang, wishlist_ids.{% endcomment %}
<form method="post" action="{% url 'barang:toggle_wishlist' barang.pk %}" data-wishlist-form>
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  {% if barang.pk in wishlist_ids %}
  <button type="submit" class="heart is-on" aria-pressed="true" aria-label="Hapus dari wishlist">
  {% else %}
  <button type="submit" class="heart" aria-pressed="false" aria-label="Simpan ke wishlist">
  {% endif %}
    <span class="heart__circle">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.6-4.6-9.6-9.4C1.1 7.9 3.3 4.5 6.8 4.5c2 0 3.6 1.1 5.2 3 1.6-1.9 3.2-3 5.2-3 3.5 0 5.7 3.4 4.4 6.6-2 4.8-9.6 9.4-9.6 9.4z"/></svg>
    </span>
  </button>
</form>
