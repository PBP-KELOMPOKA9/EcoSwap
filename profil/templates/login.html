{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EcoSwap</title>
    <!-- load tailwind css via cdn -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex h-screen w-full font-sans bg-gray-50 overflow-hidden">

    <!-- area kiri: form login dengan latar putih -->
    <div class="w-full lg:w-1/2 bg-white flex flex-col justify-between p-10 lg:p-14 h-full">
        
        <!-- logo ecoswap di pojok kiri atas -->
        <div>
            <img src="{% static 'logoEco.png' %}" alt="Logo EcoSwap" class="h-14 lg:h-16 object-contain">
        </div>

        <!-- form login atur lebar dan teks -->
        <div class="w-full max-w-[500px] mx-auto my-auto py-2">
            
            <!-- judul sign in dan ajakan daftar akun -->
            <div class="mb-8">
                <h1 class="text-4xl lg:text-5xl font-black text-gray-900 tracking-tight">Sign in</h1>
                <p class="text-gray-500 mt-3 text-base lg:text-lg">
                    Don't have an account? 
                    <a href="#" class="text-green-700 font-bold underline hover:text-green-800">Create now</a>
                </p>
            </div>
            
            <!-- formulir login pengguna -->
            <form class="space-y-6">
                
                <!-- field input email -->
                <div>
                    <label class="block text-base font-bold text-gray-800 mb-2">E-mail</label>
                    <input type="email" placeholder="asoyybah@gmail.com" 
                           class="w-full border border-gray-300 rounded-xl px-5 py-4 text-base text-gray-900 placeholder-gray-400 focus:outline-none focus:border-green-600 focus:ring-2 focus:ring-green-600/20 transition shadow-sm">
                </div>

                <!-- field input password dan tombol intip -->
                <div>
                    <label class="block text-base font-bold text-gray-800 mb-2">Password</label>
                    <div class="relative">
                        <input type="password" placeholder="@#*%" 
                               class="w-full border border-gray-300 rounded-xl px-5 py-4 pr-14 text-base text-gray-900 placeholder-gray-400 focus:outline-none focus:border-green-600 focus:ring-2 focus:ring-green-600/20 transition shadow-sm">
                        <!-- ikon mata intip password -->
                        <button type="button" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-gray-600">
                            <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- remember me dan forgot password -->
                <div class="flex items-center justify-between text-base pt-1">
                    <label class="flex items-center text-gray-700 cursor-pointer select-none">
                        <input type="checkbox" class="w-5 h-5 rounded border-gray-300 text-green-700 focus:ring-green-600 mr-2.5">
                        Remember me
                    </label>
                    <a href="#" class="font-bold text-gray-800 underline hover:text-green-700">Forgot Password?</a>
                </div>

                <!-- tombol submit sign in -->
                <button type="button" class="w-full bg-[#357A4B] hover:bg-[#2b643d] text-white font-bold py-4 rounded-xl shadow-md transition duration-150 text-lg tracking-wide mt-3">
                    Sign in
                </button>
                
            </form>

        </div>

        <!-- seimbangin agar posisi form tetap simetris -->
        <div class="hidden lg:block h-6"></div>
        
    </div>

    <!-- area kanan: background gradasi hijau -->
    <div class="hidden lg:flex lg:w-1/2 bg-gradient-to-b from-[#0E5B37] via-[#357A4B] to-[#76933F] relative flex-col justify-between p-10 lg:p-14 text-white h-full">
        
        <!-- tombol bantuan support di pojok kanan atas -->
        <div class="flex justify-end z-10">
            <a href="#" class="text-base font-semibold hover:underline opacity-90 flex items-center space-x-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3m8.293 8.293l1.414 1.414"/>
                </svg>
                <span>Support</span>
            </a>
        </div>

        <!-- pesan sambutan hello friend di tengah -->
        <div class="flex flex-col items-center text-center max-w-lg mx-auto z-10">
            <h2 class="text-5xl lg:text-6xl font-black mb-6 tracking-tight">Hello, Friend!</h2>
            <p class="text-white/90 text-lg lg:text-xl leading-relaxed mb-10">
                Yuk tukar dan cari barang bekas berkualitas di EcoSwap untuk kurangi sampah di sekitar kita.
            </p>
            <!-- tombol ajakan sign up -->
            <a href="#" class="border-2 border-white text-white font-bold px-12 py-3.5 rounded-full hover:bg-white hover:text-green-800 transition duration-150 text-base tracking-widest uppercase">
                SIGN UP
            </a>
        </div>

        <!-- penunjuk navigasi slider di bagian bawah -->
        <div class="flex justify-center items-center space-x-3 text-white/60 text-sm z-10 pb-2">
            <span class="cursor-pointer hover:text-white">&lt;</span>
            <span class="w-2.5 h-2.5 bg-white/40 rounded-full"></span>
            <span class="w-3.5 h-3.5 bg-white rounded-full"></span>
            <span class="w-2.5 h-2.5 bg-white/40 rounded-full"></span>
            <span class="cursor-pointer hover:text-white">&gt;</span>
        </div>

    </div>

</body>
</html>
